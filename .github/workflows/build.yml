name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          for z in *.zip; do [ -f "$z" ] && mkdir -p _src && unzip -qo "$z" -d _src; done || true
          root=.; [ -d _src ] && root=_src
          echo "dir=$(dirname "$(find $root -name settings.gradle.kts | head -1)")" >> $GITHUB_OUTPUT
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - run: gradle assembleRelease --no-daemon -Pvc=${{ github.run_number }} -Pslug=${{ github.repository }}
        working-directory: ${{ steps.p.outputs.dir }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/release/app-release.apk
      - run: gh release create v${{ github.run_number }} "${{ steps.p.outputs.dir }}/app/build/outputs/apk/release/app-release.apk" --title "v${{ github.run_number }}" --notes "build ${{ github.run_number }}"
        env:
          GH_TOKEN: ${{ github.token }}
          
